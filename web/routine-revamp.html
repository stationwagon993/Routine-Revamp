<style>
/* Layout: one working surface under a sticky lab toolbar; the sample log is a spreadsheet-style grid, everything else is a narrow work column. */
:root {
  --bg: #f3f5f5;
  --surface: #ffffff;
  --surface-2: #eaeeee;
  --fg: #182224;
  --muted: #586769;
  --line: #cfd8d9;
  --accent: #0d6468;
  --accent-fg: #ffffff;
  --accent-soft: #dcecec;
  --bar: #12393b;
  --bar-fg: #d9ecec;
  --st-requested: #f7e94a;
  --st-requested-fg: #3d3500;
  --st-completed: #1f9d4c;
  --st-completed-fg: #ffffff;
  --st-compiling: #f5a623;
  --st-compiling-fg: #3a2400;
  --st-cancelled: #d93a3a;
  --st-cancelled-fg: #ffffff;
  --st-oldest: #2a8fd0;
  --st-oldest-fg: #ffffff;
  --good: #1b7a3d;
  --good-soft: #e0f3e6;
  --bad: #b42323;
  --bad-soft: #fbe5e5;
  --warn-soft: #fff4d4;
  --warn-line: #e2b42c;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-cond: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111819; --surface: #182224; --surface-2: #213033; --fg: #e3eced; --muted: #9db0b2; --line: #33474a;
    --accent: #5cc3c5; --accent-fg: #0b1d1e; --accent-soft: #1d3c3e; --bar: #0b2324; --bar-fg: #cfe6e6;
    --st-requested: #d9c92c; --st-requested-fg: #1f1a00; --st-completed: #2a9a52; --st-completed-fg: #ffffff;
    --st-compiling: #d98e1a; --st-compiling-fg: #1f1300; --st-cancelled: #c53b3b; --st-cancelled-fg: #ffffff;
    --st-oldest: #2f86c0; --st-oldest-fg: #ffffff;
    --good: #6dd394; --good-soft: #17331f; --bad: #f08a8a; --bad-soft: #3a1b1b; --warn-soft: #382e10; --warn-line: #a88516;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111819; --surface: #182224; --surface-2: #213033; --fg: #e3eced; --muted: #9db0b2; --line: #33474a;
  --accent: #5cc3c5; --accent-fg: #0b1d1e; --accent-soft: #1d3c3e; --bar: #0b2324; --bar-fg: #cfe6e6;
  --st-requested: #d9c92c; --st-requested-fg: #1f1a00; --st-completed: #2a9a52; --st-completed-fg: #ffffff;
  --st-compiling: #d98e1a; --st-compiling-fg: #1f1300; --st-cancelled: #c53b3b; --st-cancelled-fg: #ffffff;
  --st-oldest: #2f86c0; --st-oldest-fg: #ffffff;
  --good: #6dd394; --good-soft: #17331f; --bad: #f08a8a; --bad-soft: #3a1b1b; --warn-soft: #382e10; --warn-line: #a88516;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 600; }
.mono, code { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bar); color: var(--bar-fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 4px 2px; flex-wrap: wrap;
}
.bar .brand { font-family: var(--font-cond); font-weight: 600; font-size: 1.05rem; letter-spacing: 0.02em; margin-right: 14px; padding-block: 10px; }
.bar .brand small { font-weight: 500; opacity: 0.7; margin-left: 6px; font-size: 0.8rem; }
.bar a { color: var(--bar-fg); text-decoration: none; padding: 10px 10px; border-bottom: 2px solid transparent; }
.bar a:hover { color: #fff; }
.bar a[aria-current="page"] { color: #fff; border-bottom-color: var(--st-requested); }
.bar .spacer { flex: 1; }
.bar .who { font-size: 0.85rem; opacity: 0.85; padding-block: 10px; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; display: grid; gap: 14px; }
.narrow { max-width: 1080px; width: 100%; margin-inline: auto; display: grid; gap: 14px; }
.head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.head .spacer { flex: 1; }
.crumb { font-size: 0.85rem; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); border-radius: 4px; padding: 6px 12px; cursor: pointer; text-decoration: none; font-weight: 500; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 3px 9px; font-size: 0.85rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

input[type=text], input[type=email], input[type=date], input[type=number], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; max-width: 100%; min-width: 0;
}
textarea { width: 100%; resize: vertical; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 10px 16px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .label { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.field input, .field select, .field textarea { width: 100%; }
.hint { font-size: 0.8rem; color: var(--muted); }
.err { color: var(--bad); font-size: 0.85rem; }
.checks { columns: 3 220px; column-gap: 16px; }
.checks label { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; break-inside: avoid; }

.banner { border: 1px solid var(--warn-line); background: var(--warn-soft); border-radius: 4px; padding: 8px 12px; }
.banner.bad { border-color: var(--bad); background: var(--bad-soft); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 4px; z-index: 20; max-width: min(420px, calc(100vw - 32px)); }

.scroll { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; background: var(--surface); }
table.data th, table.data td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: middle; }
table.data th { background: var(--surface-2); font-weight: 600; font-size: 0.85rem; }
table.data td.num { text-align: right; }
table.data input { width: 9em; }

.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.pill.requested { background: var(--st-requested); color: var(--st-requested-fg); }
.pill.completed { background: var(--st-completed); color: var(--st-completed-fg); }
.pill.compiling { background: var(--st-compiling); color: var(--st-compiling-fg); }
.pill.cancelled { background: var(--st-cancelled); color: var(--st-cancelled-fg); }
.pill.good { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--fg); border-color: var(--warn-line); }
.pill.plain { background: var(--surface-2); color: var(--muted); border-color: var(--line); }

/* Sample log grid */
.tools { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.sw { display: inline-block; min-width: 24px; height: 16px; padding: 0 4px; font: 600 11px/16px var(--font-mono); text-align: center; border: 1px solid var(--line); border-radius: 2px; }
.logwrap { overflow: auto; max-height: calc(100vh - 230px); min-height: 240px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; }
table.log { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.log th, table.log td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 3px 6px; white-space: nowrap; background: var(--surface); }
table.log thead th { position: sticky; background: var(--surface-2); z-index: 2; font-family: var(--font-cond); }
table.log thead tr.g th { top: 0; height: 26px; text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
table.log thead tr.c th { top: 26px; vertical-align: bottom; text-align: left; font-weight: 600; }
table.log th.v { width: 30px; height: 172px; padding: 5px 2px; }
table.log th.v span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: normal; max-height: 166px; display: inline-block; line-height: 1.12; font-size: 12px; }
table.log th.v small { font-family: var(--font-mono); font-weight: 400; font-size: 10px; color: var(--muted); }
table.log .stick { position: sticky; left: 0; z-index: 1; }
table.log thead .stick { z-index: 3; }
table.log tbody tr { cursor: pointer; }
table.log tbody tr:hover td { background: var(--accent-soft); }
table.log td.sn { font-family: var(--font-mono); font-weight: 500; }
table.log td.sn a { color: inherit; text-decoration: none; }
table.log td.id { max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
table.log td.cell { width: 30px; text-align: center; font: 600 11px var(--font-mono); }
table.log tbody tr td.requested { background: var(--st-requested); color: var(--st-requested-fg); }
table.log tbody tr td.completed { background: var(--st-completed); color: var(--st-completed-fg); }
table.log tbody tr td.compiling { background: var(--st-compiling); color: var(--st-compiling-fg); }
table.log tbody tr td.cancelled { background: var(--st-cancelled); color: var(--st-cancelled-fg); }
table.log tbody tr td.oldest { background: var(--st-oldest); color: var(--st-oldest-fg); }

/* Sample page */
dl.info { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; }
dl.info dt { color: var(--muted); font-size: 0.85rem; }
dl.info dd { margin: 0; overflow-wrap: anywhere; }
.test { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
.test > header { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: 6px 6px 0 0; }
.test > header h3 { flex: 1; min-width: 160px; }
.test > header .code { font-family: var(--font-mono); font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.test .body { padding: 10px 12px; display: grid; gap: 10px; }
.test.collapsed .body { display: none; }
.test.collapsed > header { border-bottom: 0; border-radius: 6px; }
.inputs { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.inputs .field input { width: 9.5em; }
.out { font-size: 1.05rem; min-height: 1.5em; }
.out b { font-family: var(--font-mono); font-weight: 500; }
.expr { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.list { display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise 0.18s ease-out; } @keyframes rise { from { transform: translateY(6px); opacity: 0; } } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
"use strict";

/* ------------------------------------------------------------------ */
/* Safe formula engine: arithmetic only, never eval.                   */
/* ------------------------------------------------------------------ */
const FUNCS = { abs: Math.abs, min: Math.min, max: Math.max, round: Math.round, sqrt: Math.sqrt, log: Math.log, log10: Math.log10, exp: Math.exp };
const CONSTS = { pi: Math.PI, e: Math.E };

function parseFormula(src) {
  const tokens = [];
  const re = /\s*(?:(\d+(?:\.\d*)?(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?)|([A-Za-z_][A-Za-z0-9_]*)|(\*\*|[-+*/%^(),]))/y;
  const text = String(src || "").trim();
  if (!text) throw new Error("The formula is empty.");
  let pos = 0;
  while (pos < text.length) {
    re.lastIndex = pos;
    const m = re.exec(text);
    if (!m || m[0].length === 0) {
      if (/^\s+$/.test(text.slice(pos))) break;
      throw new Error(`"${text.slice(pos).trim()[0]}" is not allowed in a formula.`);
    }
    pos = re.lastIndex;
    if (m[1] !== undefined) tokens.push({ t: "num", v: parseFloat(m[1]) });
    else if (m[2] !== undefined) tokens.push({ t: "name", v: m[2] });
    else tokens.push({ t: "op", v: m[3] === "**" ? "^" : m[3] });
  }
  let i = 0;
  const peek = () => tokens[i];
  const take = (v) => { const tk = tokens[i]; if (tk && tk.t === "op" && tk.v === v) { i++; return true; } return false; };
  const names = new Set();
  function expr() { let n = term(); for (;;) { if (take("+")) n = { op: "+", a: n, b: term() }; else if (take("-")) n = { op: "-", a: n, b: term() }; else return n; } }
  function term() { let n = unary(); for (;;) { if (take("*")) n = { op: "*", a: n, b: unary() }; else if (take("/")) n = { op: "/", a: n, b: unary() }; else if (take("%")) n = { op: "%", a: n, b: unary() }; else return n; } }
  function unary() { if (take("-")) return { op: "neg", a: unary() }; if (take("+")) return unary(); return power(); }
  function power() { const base = primary(); if (take("^")) return { op: "^", a: base, b: unary() }; return base; }
  function primary() {
    const tk = peek();
    if (!tk) throw new Error("The formula ends too early.");
    if (tk.t === "num") { i++; return { num: tk.v }; }
    if (tk.t === "name") {
      i++;
      if (take("(")) {
        if (!FUNCS[tk.v]) throw new Error(`Unknown function "${tk.v}". Allowed: ${Object.keys(FUNCS).join(", ")}.`);
        const args = [];
        if (!take(")")) { do { args.push(expr()); } while (take(",")); if (!take(")")) throw new Error("A closing ) is missing."); }
        return { fn: tk.v, args };
      }
      if (!(tk.v in CONSTS)) names.add(tk.v);
      return { name: tk.v };
    }
    if (take("(")) { const n = expr(); if (!take(")")) throw new Error("A closing ) is missing."); return n; }
    throw new Error(`Unexpected "${tk.v}".`);
  }
  const ast = expr();
  if (i < tokens.length) throw new Error(`Unexpected "${tokens[i].v}".`);
  return { ast, names };
}

function checkFormula(src, inputNames) {
  const { ast, names } = parseFormula(src);
  const unknown = [...names].filter((n) => !inputNames.includes(n));
  if (unknown.length) throw new Error(`The formula uses names that are not inputs: ${unknown.join(", ")}.`);
  return ast;
}

function evalAst(n, vals) {
  if ("num" in n) return n.num;
  if ("name" in n) return n.name in vals ? vals[n.name] : CONSTS[n.name];
  if (n.fn) return FUNCS[n.fn](...n.args.map((a) => evalAst(a, vals)));
  const a = evalAst(n.a, vals);
  if (n.op === "neg") return -a;
  const b = evalAst(n.b, vals);
  switch (n.op) {
    case "+": return a + b;
    case "-": return a - b;
    case "*": return a * b;
    case "/": if (b === 0) throw new Error("Division by zero."); return a / b;
    case "%": return a % b;
    case "^": if (Math.abs(b) > 100) throw new Error("Exponent is too large."); return Math.pow(a, b);
  }
  throw new Error("Unsupported formula.");
}

function runFormula(formula, raw) {
  const names = formula.inputs.map((x) => x.name);
  const ast = checkFormula(formula.expression, names);
  const vals = {};
  for (const inp of formula.inputs) {
    const s = String(raw[inp.name] ?? "").trim();
    if (s === "" || !isFinite(Number(s))) throw new Error(`Enter a number for ${inp.label || inp.name}.`);
    vals[inp.name] = Number(s);
  }
  const v = evalAst(ast, vals);
  if (!isFinite(v)) throw new Error("The calculation did not give a finite number.");
  return { value: v, inputs: vals };
}

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pad = (n, w = 2) => String(n).padStart(w, "0");
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function fmtDate(s) { if (!s) return ""; const [y, m, d] = s.slice(0, 10).split("-"); return `${m}/${d}/${y}`; }
function fmtStamp(iso) { if (!iso) return ""; const d = new Date(iso); return `${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function julian(s) { const d = parseDate(s); const start = new Date(d.getFullYear(), 0, 1); const doy = Math.round((d - start) / 86400000) + 1; return `${String(d.getFullYear()).slice(2)}${pad(doy, 3)}`; }
function addMonths(s, n) { const d = parseDate(s); const t = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); t.setDate(Math.min(d.getDate(), last)); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; }
function daysUntil(s) { return Math.round((parseDate(s) - parseDate(today())) / 86400000); }
function fixed(v, d) { return v === null || v === undefined || v === "" ? "" : Number(v).toFixed(d); }
function uid36() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || uid36(); }
let toastTimer = null;
function toast(msg) {
  $$(".toast").forEach((x) => x.remove());
  clearTimeout(toastTimer);
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 3800);
}

const GROUPS = [["general", "General"], ["refrigerant", "Refrigerant"], ["oil", "Oil"]];
const TYPES = { tracking: "Status only", manual: "Typed-in result", formula: "Calculated from a formula", blend: "Blend analysis from calibration" };
const STATUS = { requested: "Analysis requested", compiling: "Test run, data needs compiling", completed: "Testing completed", cancelled: "Testing cancelled" };
const OPEN = new Set(["requested", "compiling"]);
const RESULTS_REPORTED = "results-reported";

/* ------------------------------------------------------------------ */
/* State, loaded live from the shared database                         */
/* ------------------------------------------------------------------ */
const S = {
  db: null, user: null, uid: null, canWrite: true,
  loaded: new Set(),
  methods: [], formulas: [], blends: [], cals: [], samples: [], reports: [], people: {},
  settings: { labName: "", tolerance: 0.03, validMonths: 6, signature: "" },
  profiles: {},
};
const COLLECTIONS = ["methods", "formulas", "blends", "calibrations", "samples", "reports", "people"];

const methodById = (id) => S.methods.find((m) => m.id === id);
const blendById = (id) => S.blends.find((b) => b.id === id);
const calById = (id) => S.cals.find((c) => c.id === id);
const sampleById = (id) => S.samples.find((s) => s.id === id);
function orderedMethods(list = S.methods) {
  const g = GROUPS.map((x) => x[0]);
  return [...list].sort((a, b) => g.indexOf(a.group) - g.indexOf(b.group) || (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name));
}
function currentFormula(methodId) {
  return S.formulas.filter((f) => f.methodId === methodId).sort((a, b) => b.version - a.version)[0] || null;
}
function formulaById(id) { return S.formulas.find((f) => f.id === id); }

function personName(id) { if (!id) return ""; return (S.profiles[id] && S.profiles[id].name) || "Someone"; }
function initials(id) {
  if (!id) return "";
  const own = S.people[id] && S.people[id].initials;
  if (own) return own;
  const n = S.profiles[id] && S.profiles[id].name;
  if (n) return n.split(/\s+/).filter(Boolean).map((p) => p[0]).join("").slice(0, 3).toUpperCase();
  return "✓";
}

/* Calibrations */
function verificationPassed(cal, v) {
  if (!v || !v.rows || !v.rows.length) return false;
  return v.rows.every((r) => Math.abs(verifyCalc(cal, r).diff) <= Number(S.settings.tolerance) + 1e-9);
}
function compRF(c) { const mean = (Number(c.a1) + Number(c.a2) + Number(c.a3)) / 3; return { mean, rf: Number(c.std) / mean }; }
function verifyCalc(cal, row) {
  const comp = cal.components.find((c) => c.name === row.name);
  const calc = Number(row.area) * compRF(comp).rf;
  return { calc, diff: calc - Number(row.theo) };
}
function latestVerification(cal) { const v = cal.verifications || []; return v.length ? v[v.length - 1] : null; }
function calStatus(cal) {
  if (daysUntil(cal.expires) < 0) return "expired";
  const v = latestVerification(cal);
  if (!v) return "unverified";
  return verificationPassed(cal, v) ? "active" : "failed";
}
const CAL_LABEL = { active: ["Active", "good"], unverified: ["Needs verification", "warn"], failed: ["Verification failed", "bad"], expired: ["Expired", "plain"] };
function activeCal(blendId) {
  return S.cals.filter((c) => c.blendId === blendId && c.on <= today() && calStatus(c) === "active").sort((a, b) => b.on.localeCompare(a.on))[0] || null;
}

/* Samples */
function sampleTests(s) {
  const tests = s.tests || {};
  return orderedMethods(S.methods.filter((m) => tests[m.id])).map((m) => ({ method: m, t: tests[m.id] }));
}
function isOpen(s) { return Object.values(s.tests || {}).some((t) => OPEN.has(t.status)); }
function oldestOpen() { return [...S.samples].filter(isOpen).sort((a, b) => a.julian.localeCompare(b.julian) || a.seq - b.seq)[0] || null; }
function cellText(t) { if (!t) return ""; if (t.status === "completed") return initials(t.by); if (t.status === "requested") return "-"; return ""; }
function displayValue(r) { return r.value === null || r.value === undefined ? (r.text || "") : Number(r.value).toFixed(r.decimals ?? 2); }
function usesPlaceholder(s) {
  return Object.values(s.tests || {}).some((t) => t.formulaId && formulaById(t.formulaId) && formulaById(t.formulaId).placeholder);
}

/* ------------------------------------------------------------------ */
/* Writes                                                               */
/* ------------------------------------------------------------------ */
async function write(fn, okMsg) {
  if (!S.db) { toast("The lab database isn't available in this view."); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument" && S.canWrite !== true) { S.canWrite = false; render(); toast("You have view-only access, so changes can't be saved."); }
    else if (code === "quota_exceeded") toast("The lab database is full. Delete old records to free space.");
    else toast(e && e.message ? e.message : "The change could not be saved. Try again.");
    return false;
  }
}

async function nextSequence(jul) {
  const ref = S.db.doc("counters/" + jul);
  const holder = S.uid || "tab-" + uid36();
  for (let tries = 0; tries < 25; tries++) {
    const lease = await ref.acquire({ holder, ttlMs: 6000 });
    if (lease.acquired) {
      const snap = await ref.get();
      const last = (snap.exists && Number(snap.data().last)) || 0;
      const seen = Math.max(0, ...S.samples.filter((s) => s.julian === jul).map((s) => s.seq));
      const n = Math.max(last, seen) + 1;
      await ref.set({ last: n });
      return n;
    }
    await sleep(250 + Math.random() * 400);
  }
  throw new Error("Someone else is logging a sample right now. Try again in a moment.");
}

/* ------------------------------------------------------------------ */
/* Routing and rendering                                                */
/* ------------------------------------------------------------------ */
let ui = { q: "", show: "all", expanded: {}, confirm: null };
function route() { return (location.hash || "#log").slice(1) || "log"; }
function go(h) { if (location.hash === "#" + h) render(); else location.hash = h; }

function captureForm() {
  const kept = {};
  $$("#main [id]").forEach((el) => { if (el.dataset.dirty && "value" in el) kept[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  const f = document.activeElement && document.activeElement.id;
  return { kept, focus: f, route: route() };
}
function restoreForm(st) {
  if (st.route !== route()) return;
  for (const [id, v] of Object.entries(st.kept)) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.type === "checkbox") el.checked = v; else el.value = v;
    el.dataset.dirty = "1";
  }
  if (st.focus) { const el = document.getElementById(st.focus); if (el) el.focus(); }
  $$("#main [data-live]").forEach((el) => el.dispatchEvent(new Event("input", { bubbles: true })));
}

let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

function render() {
  const r = route();
  $$("[data-nav]").forEach((a) => {
    const n = a.dataset.nav;
    const on = r === n || r.startsWith(n.replace(/s$/, "") + "-") || (n === "log" && (r.startsWith("sample-") || r.startsWith("edit-"))) || (n === "calibrations" && (r === "calibrate" || r.startsWith("verify-"))) || (n === "formulas" && r.startsWith("formula-"));
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  $("#labName").textContent = S.settings.labName ? "· " + S.settings.labName : "";
  const main = $("#main");
  if (!S.db) { main.innerHTML = noDbView(); return; }
  if (!COLLECTIONS.every((c) => S.loaded.has(c))) return;
  const st = captureForm();
  let html;
  if (r === "log") html = logView();
  else if (r === "intake") html = sampleForm(null);
  else if (r.startsWith("edit-")) html = sampleForm(sampleById(r.slice(5)));
  else if (r.startsWith("sample-")) html = sampleView(sampleById(r.slice(7)));
  else if (r === "reports") html = reportsView();
  else if (r.startsWith("report-")) html = reportView(S.reports.find((x) => x.id === r.slice(7)));
  else if (r === "calibrations") html = calsView();
  else if (r === "calibrate") html = calForm();
  else if (r.startsWith("calibration-")) html = calView(calById(r.slice(12)));
  else if (r.startsWith("verify-")) html = verifyForm(calById(r.slice(7)));
  else if (r === "formulas") html = formulasView();
  else if (r.startsWith("formula-")) html = formulaForm(methodById(r.slice(8)));
  else if (r === "setup") html = setupView();
  else html = logView();
  const banner = S.canWrite === false ? `<div class="banner">You have view-only access. Ask the page owner to give you Contributor or Editor access to log samples and enter results.</div>` : "";
  main.innerHTML = banner + html;
  restoreForm(st);
  if (S.canWrite === false) $$("#main [data-write]").forEach((el) => { el.disabled = true; });
}

function noDbView() {
  return `<div class="narrow"><div class="panel empty"><h2>The lab database isn't available here</h2>

    <span><span class="sw" style="background:var(--st-completed);color:var(--st-completed-fg)">CS</span>Testing completed (initials)</span>
    <span><span class="sw" style="background:var(--st-compiling)"></span>Test run, data needs compiling</span>

    <span><span class="sw">${julian(today())}</span>Today's Julian date</span>

  ${methods.length ? `<div class="logwrap"><table class="log"><thead>${head1}${head2}</thead><tbody>${body || `<tr><td colspan="99" class="empty">${S.samples.length ? "No samples match." : `No samples yet. <a href="#intake">Log the first sample</a>.`}</td></tr>`}</tbody></table></div>`
  : `<div class="panel empty"><h2>No tests are set up yet</h2><p>Add the sample log's test columns under <a href="#setup">Setup</a>.</p></div>`}`;

async function submitSample(form, another) {
  const editing = route().startsWith("edit-") ? sampleById(route().slice(5)) : null;
  const val = (id) => $("#" + id).value.trim();
  const err = $("#formErr");
  const data = {
    type: val("f-type"), phase: val("f-phase"), blendId: val("f-blend"), identification: val("f-ident"), source: val("f-source"),
    lto: val("f-lto"), requestedBy: val("f-req"), requestedEmail: val("f-email"), cc: val("f-cc"), comments: $("#f-comments").value.trim(),
  };
  if (!data.identification) { err.textContent = "Enter the sample identification."; $("#f-ident").focus(); return; }
  if (editing) {
    if (await write(() => S.db.doc("samples/" + editing.id).update(data), "Sample updated.")) go("sample-" + editing.id);
    return;
  }
  const received = val("f-received");
  if (!received) { err.textContent = "Enter the received date."; return; }
  const chosen = $$("[data-test]", form).filter((c) => c.checked).map((c) => c.dataset.test);
  if (chosen.some((id) => methodById(id)?.type === "blend") && !data.blendId) { err.textContent = "Choose the blend for blend analysis."; $("#f-blend").focus(); return; }
  const tests = {};
  for (const id of [...chosen, ...S.methods.filter((m) => m.everySample && m.active !== false).map((m) => m.id)]) tests[id] = { status: "requested" };
  $$("button", form).forEach((b) => { b.disabled = true; });
  err.textContent = "";
  let number;
  const ok = await write(async () => {
    const jul = julian(received);
    const seq = await nextSequence(jul);
    number = `${jul}-${seq}`;
    await S.db.doc("samples/" + number).set({ ...data, number, julian: jul, seq, receivedOn: received, receivedBy: S.uid, createdAt: new Date().toISOString(), tests });
  });
  $$("button", form).forEach((b) => { b.disabled = false; });
  if (!ok) return;
  toast(`Sample ${number} logged.`);
  if (another) { $$("#main [data-dirty]").forEach((el) => delete el.dataset.dirty); render(); } else go("sample-" + number);
}

function basedOn(t) {

  if (t.calibrationId) { const c = calById(t.calibrationId); parts.push(c ? `<a href="#calibration-${esc(c.id)}">Calibration ${fmtDate(c.on)}</a>` : "Calibration"); }
  return parts.join(" ");
}

function entryForm(s, m, t, blend, cal) {
  const key = esc(m.id);
  const prev = t.inputs || {};
  if (m.type === "formula") {
    const f = currentFormula(m.id);
    if (!f) return `<p class="muted">No formula is set up for this test. <a href="#formula-${key}">Add one</a>.</p>`;
    return `${f.placeholder ? `<div class="banner">This is a <b>placeholder formula</b> that hasn't been confirmed by the lab. <a href="#formula-${key}">Enter the real formula</a>.</div>` : ""}
    <form data-result="${key}" data-kind="formula" data-formula="${esc(f.id)}">
      <div class="inputs">${f.inputs.map((inp) => `<div class="field"><label for="in-${key}-${esc(inp.name)}">${esc(inp.label)}${inp.unit ? ` (${esc(inp.unit)})` : ""}</label>
        <input type="text" inputmode="decimal" id="in-${key}-${esc(inp.name)}" data-input="${esc(inp.name)}" data-live value="${esc(prev[inp.name] ?? "")}" autocomplete="off"></div>`).join("")}

  }
  if (m.type === "blend") {
    if (!blend) return `<p class="muted">Set the sample's blend (<a href="#edit-${esc(s.id)}">edit sample</a>) to enter blend analysis data.</p>`;
    if (!cal) return `<div class="banner bad">There is no current, verified calibration for ${esc(blend.name)}, so blend results can't be calculated. <a href="#calibrate">Calibrate ${esc(blend.name)}</a></div>`;
    return `<p class="small muted">Using the ${esc(blend.name)} calibration from <a href="#calibration-${esc(cal.id)}">${fmtDate(cal.on)}</a>, expires ${fmtDate(cal.expires)}.</p>
    <form data-result="${key}" data-kind="blend" data-cal="${esc(cal.id)}">
      <div class="scroll"><table class="data"><tr><th>Component</th><th>Response factor</th><th>Sample peak area</th><th>Result</th></tr>
      ${cal.components.map((c, i) => `<tr><td>${esc(c.name)}</td><td class="num mono">${compRF(c).rf.toPrecision(6)}</td>
        <td><input type="text" inputmode="decimal" id="area-${key}-${i}" data-area="${esc(c.name)}" data-live aria-label="${esc(c.name)} peak area" value="${esc(prev[c.name] ?? "")}" autocomplete="off"></td>
        <td class="num mono" data-pct="${esc(c.name)}"></td></tr>`).join("")}
      <tr><td colspan="3" class="num muted">Total</td><td class="num mono" data-total></td></tr></table></div>
      <div class="out err" aria-live="polite"></div>
      <div><button class="btn" type="submit" data-write>Save results</button></div>
    </form>`;
  }
  if (m.type === "manual") {
    const r = (t.results || [])[0];
    return `<form data-result="${key}" data-kind="manual" class="inputs">
      <div class="field"><label for="mv-${key}">Result</label><input type="text" id="mv-${key}" value="${esc(r ? displayValue(r) : "")}" autocomplete="off"></div>
      <div class="field"><label for="mu-${key}">Unit</label><input type="text" id="mu-${key}" value="${esc(r ? r.unit : m.unit || "")}" style="width:7em"></div>
      <button class="btn" type="submit" data-write>Save result</button>
      <div class="out err" aria-live="polite" style="flex-basis:100%"></div>
    </form>`;
  }
  return "";
}

function computeResult(form) {
  const kind = form.dataset.kind;
  if (kind === "formula") {
    const f = formulaById(form.dataset.formula);
    const raw = {};
    $$("[data-input]", form).forEach((el) => { raw[el.dataset.input] = el.value; });
    const { value, inputs } = runFormula(f, raw);
    return { results: [{ label: "", value, unit: f.unit || "", decimals: f.decimals ?? 2 }], inputs, formulaId: f.id, formulaVersion: f.version, calibrationId: null };
  }
  if (kind === "blend") {
    const cal = calById(form.dataset.cal);
    const inputs = {};
    const results = cal.components.map((c, i) => {
      const el = $$("[data-area]", form).find((x) => x.dataset.area === c.name);
      const s = el.value.trim();
      if (s === "" || !isFinite(Number(s))) throw new Error(`Enter the peak area for ${c.name}.`);
      inputs[c.name] = Number(s);
      return { label: c.name, value: Number(s) * compRF(c).rf, unit: "%", decimals: 2 };
    });
    return { results, inputs, formulaId: null, formulaVersion: null, calibrationId: cal.id };
  }
  const raw = $("[id^=mv-]", form).value.trim();
  if (!raw) throw new Error("Enter a result.");
  const unit = $("[id^=mu-]", form).value.trim();
  const isNum = raw !== "" && isFinite(Number(raw));
  const decimals = isNum && raw.includes(".") ? raw.split(".")[1].length : 0;
  return { results: [isNum ? { label: "", value: Number(raw), unit, decimals } : { label: "", value: null, text: raw, unit, decimals: 0 }], inputs: {}, formulaId: null, formulaVersion: null, calibrationId: null };
}

function livePreview(form) {
  const out = $(".out", form);
  const kind = form.dataset.kind;
  if (kind === "blend") {
    const cal = calById(form.dataset.cal);
    let total = 0, all = true;
    cal.components.forEach((c) => {
      const el = $$("[data-area]", form).find((x) => x.dataset.area === c.name);
      const cell = $$("[data-pct]", form).find((x) => x.dataset.pct === c.name);
      const s = el.value.trim();
      if (s !== "" && isFinite(Number(s))) { const p = Number(s) * compRF(c).rf; total += p; cell.textContent = p.toFixed(2) + " %"; }
      else { all = false; cell.textContent = ""; }
    });
    $("[data-total]", form).textContent = all ? total.toFixed(2) + " %" : "";
    out.textContent = "";
    return;
  }
  if (kind === "formula") {
    const filled = $$("[data-input]", form).every((el) => el.value.trim() !== "");
    if (!filled) { out.textContent = ""; out.classList.remove("err"); return; }
    try {
      const r = computeResult(form).results[0];
      out.classList.remove("err");
      out.innerHTML = `= <b>${esc(Number(r.value).toFixed(r.decimals))}</b> ${esc(r.unit)}`;
    } catch (e) { out.classList.add("err"); out.textContent = e.message; }
  }
}

async function saveResult(sample, methodId, form) {
  let c;
  try { c = computeResult(form); } catch (e) { const out = $(".out", form); out.classList.add("err"); out.textContent = e.message; return; }
  const patch = { tests: { [methodId]: { status: "completed", by: S.uid, at: new Date().toISOString(), results: c.results, inputs: c.inputs, formulaId: c.formulaId, formulaVersion: c.formulaVersion, calibrationId: c.calibrationId } } };
  if (await write(() => S.db.doc("samples/" + sample.id).update(patch), `${methodById(methodId).name} saved.`)) {
    ui.expanded[sample.id + ":" + methodId] = false;
    $$("[data-dirty]", form).forEach((el) => delete el.dataset.dirty);
  }
}

async function createReport(sample) {
  const extra = $$("[data-rel]").filter((c) => c.checked).map((c) => c.dataset.rel);
  const ids = [sample.id, ...extra];
  const first = ids.map(sampleById).sort((a, b) => a.julian.localeCompare(b.julian) || a.seq - b.seq)[0];
  let number = "R" + first.number, n = 1;
  while (S.reports.some((r) => r.number === number)) number = `R${first.number}-${++n}`;
  const id = "rep-" + uid36();
  if (await write(() => S.db.doc("reports/" + id).set({ number, sampleIds: ids, to: sample.requestedEmail || "", cc: sample.cc || "", notes: "", status: "draft", createdBy: S.uid, createdAt: new Date().toISOString() }), `Report ${number} created.`)) go("report-" + id);
}

async function markSent(r) {
  const at = new Date().toISOString();
  const ok = await write(async () => {
    await S.db.doc("reports/" + r.id).update({ status: "sent", sentBy: S.uid, sentAt: at });
    for (const s of reportSamples(r)) {
      if ((s.tests || {})[RESULTS_REPORTED]) await S.db.doc("samples/" + s.id).update({ tests: { [RESULTS_REPORTED]: { status: "completed", by: S.uid, at } } });
    }
  }, "Report marked as sent. The sample log is updated.");
  return ok;
}

async function downloadPdf(r) {
  if (!window.jspdf) { toast("The PDF tool didn't load. Reload the page and try again."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const L = 54;
  let y = 60;
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.text(S.settings.labName || "Analytical Laboratory", L, y); y += 22;
  doc.setFontSize(13); doc.text("Analysis Report", L, y); y += 16;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.text(`Report #: ${r.number}     Date: ${fmtDate(today())}`, L, y); y += 14;
  const samples = reportSamples(r);
  if (samples.some(usesPlaceholder)) { doc.setTextColor(180, 0, 0); doc.setFont("helvetica", "bold"); doc.text("DRAFT – contains results from placeholder formulas not yet confirmed by the lab.", L, y); doc.setTextColor(0); doc.setFont("helvetica", "normal"); y += 14; }
  y += 6;
  for (const s of samples) {
    const blend = blendById(s.blendId);
    doc.autoTable({
      startY: y, margin: { left: L, right: L }, theme: "grid", styles: { fontSize: 9, cellPadding: 4 }, columnStyles: { 0: { fontStyle: "bold", cellWidth: 90 }, 2: { fontStyle: "bold", cellWidth: 60 } },
      body: [["Sample #", s.number, "Received", fmtDate(s.receivedOn)], ["Identification", s.identification, "LTO #", s.lto || "—"], ...(blend ? [["Blend", blend.name, "Phase", s.phase || "—"]] : [])],
    });
    y = doc.lastAutoTable.finalY + 6;
    const rows = [];
    const notes = [];
    for (const { method: m, t } of sampleTests(s)) {
      if (m.type === "tracking" || t.status !== "completed" || !(t.results || []).length) continue;
      t.results.forEach((res, i) => rows.push([i === 0 ? m.name + (res.label ? " – " + res.label : "") : "    " + res.label, i === 0 ? m.code || "" : "", displayValue(res), res.unit || "", i === 0 ? initials(t.by) : ""]));
      if (t.calibrationId) { const c = calById(t.calibrationId); if (c) notes.push(`${m.name}: calibration of ${blendById(c.blendId)?.name || ""} on ${fmtDate(c.on)} (standard ${c.cylinder}).`); }
    }
    doc.autoTable({ startY: y, margin: { left: L, right: L }, theme: "grid", styles: { fontSize: 9, cellPadding: 4 }, headStyles: { fillColor: [220, 236, 236], textColor: 20 },
      head: [["Test", "Method", "Result", "Unit", "Analyst"]], body: rows.length ? rows : [["No completed results.", "", "", "", ""]], columnStyles: { 2: { halign: "right" } } });
    y = doc.lastAutoTable.finalY + 4;
    doc.setFontSize(8);
    for (const n of [...notes, ...(s.comments ? ["Comments: " + s.comments] : [])]) { const lines = doc.splitTextToSize(n, 504); doc.text(lines, L, y + 8); y += 10 * lines.length; }
    doc.setFontSize(10);
    y += 20;
    if (y > 680) { doc.addPage(); y = 60; }
  }
  if (r.notes) { const lines = doc.splitTextToSize("Notes: " + r.notes, 504); doc.text(lines, L, y); }
  const blob = doc.output("blob");
  const dl = await window.claude?.use("downloads");
  if (!dl) { toast("Downloads aren't available in this view. Open the page in claude.ai."); return; }
  try { await dl.save({ filename: `${r.number}.pdf`, data: blob }); toast(`${r.number}.pdf saved.`); }
  catch (e) { if (e.code !== "declined") toast(e.code === "rate_limited" ? "A download prompt is already open." : "The PDF could not be saved."); }
}

function calFormLive() {

    const ok = v.every((x) => x !== "" && isFinite(Number(x)));
    const rf = ok ? compRF({ std: v[0], a1: v[1], a2: v[2], a3: v[3] }).rf : null;
    $(`#c-rf-${i}`).textContent = ok && isFinite(rf) ? rf.toPrecision(6) : "";
  });
}

async function submitCal() {
  const b = blendById($("#c-blend").value);
  const err = $("#formErr");
  const cyl = $("#c-cyl").value.trim(), on = $("#c-on").value;
  if (!cyl) { err.textContent = "Enter the standard cylinder ID."; return; }
  if (!on) { err.textContent = "Enter the calibration date."; return; }
  const components = [];
  for (let i = 0; i < b.components.length; i++) {
    const v = [$(`#c-std-${i}`), $(`#c-a1-${i}`), $(`#c-a2-${i}`), $(`#c-a3-${i}`)].map((el) => el.value.trim());
    if (!v.every((x) => x !== "" && isFinite(Number(x)))) { err.textContent = `Fill in every value for ${b.components[i].name}.`; return; }
    if (Number(v[1]) + Number(v[2]) + Number(v[3]) <= 0) { err.textContent = `Peak areas for ${b.components[i].name} can't all be zero.`; return; }
    components.push({ name: b.components[i].name, std: Number(v[0]), a1: Number(v[1]), a2: Number(v[2]), a3: Number(v[3]) });
  }
  const id = "cal-" + uid36();
  const months = Number(S.settings.validMonths) || 6;
  if (await write(() => S.db.doc("calibrations/" + id).set({ blendId: b.id, cylinder: cyl, on, expires: addMonths(on, months), by: S.uid, notes: $("#c-notes").value.trim(), components, verifications: [], createdAt: new Date().toISOString() }), "Calibration saved. Run the verification next.")) go("calibration-" + id);
}

  return `<div class="narrow">
  <div class="head"><a class="crumb" href="#calibrations">← Calibrations</a></div>

function verifyLive() {
  const c = calById($("#verifyForm").dataset.cal);
  c.components.forEach((x, i) => {
    const theo = $(`#v-theo-${i}`).value.trim(), area = $(`#v-area-${i}`).value.trim();
    if (theo !== "" && area !== "" && isFinite(Number(theo)) && isFinite(Number(area))) {
      const k = verifyCalc(c, { name: x.name, theo: Number(theo), area: Number(area) });
      const ok = Math.abs(k.diff) <= Number(S.settings.tolerance) + 1e-9;
      $(`#v-calc-${i}`).textContent = k.calc.toFixed(4);

async function submitVerify(form) {
  const c = calById(form.dataset.cal);
  const err = $("#formErr");
  const rows = [];
  for (let i = 0; i < c.components.length; i++) {
    const theo = $(`#v-theo-${i}`).value.trim(), area = $(`#v-area-${i}`).value.trim();
    if (![theo, area].every((x) => x !== "" && isFinite(Number(x)))) { err.textContent = `Fill in both values for ${c.components[i].name}.`; return; }
    rows.push({ name: c.components[i].name, theo: Number(theo), area: Number(area) });
  }
  const v = { on: $("#v-on").value || today(), by: S.uid, cylinder: $("#v-cyl").value.trim(), notes: $("#v-notes").value.trim(), rows };
  const pass = verificationPassed(c, v);
  if (await write(() => S.db.doc("calibrations/" + c.id).update({ verifications: [...(c.verifications || []), v] }), pass ? "Verification passed. The calibration is active." : "Verification failed. The calibration can't be used.")) go("calibration-" + c.id);
}

  return `<div class="narrow">

    </div>

    <p class="out" id="fx-check" aria-live="polite"></p>
    <div class="row"><button class="btn" type="submit" data-write>Save new version</button><a href="#formulas">Cancel</a></div>
  </form></div>`;
}

function readFormulaForm() {
  const inputs = [];
  $("#fx-inputs").value.split("\n").forEach((line, n) => {
    if (!line.trim()) return;
    const [name, label, unit] = line.split("|").map((x) => (x || "").trim());
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) throw new Error(`Line ${n + 1}: "${name}" is not a valid input name.`);
    if (inputs.some((x) => x.name === name)) throw new Error(`Line ${n + 1}: "${name}" is listed twice.`);
    inputs.push({ name, label: label || name, unit: unit || "" });
  });
  if (!inputs.length) throw new Error("Add at least one input.");
  const expression = $("#fx-expr").value.trim();
  checkFormula(expression, inputs.map((x) => x.name));
  return { inputs, expression };
}

function formulaLive() {
  const out = $("#fx-check");
  try { readFormulaForm(); out.className = "out small"; out.innerHTML = `<span class="pill good">Formula is valid</span>`; }
  catch (e) { out.className = "out err"; out.textContent = $("#fx-expr").value.trim() ? e.message : ""; }
}

async function submitFormula(form) {
  const m = methodById(form.dataset.method);
  let parsed;
  try { parsed = readFormulaForm(); } catch (e) { $("#fx-check").className = "out err"; $("#fx-check").textContent = e.message; return; }
  const version = Math.max(0, ...S.formulas.filter((f) => f.methodId === m.id).map((f) => f.version)) + 1;
  const id = `${m.id}-v${version}`;
  const body = { methodId: m.id, version, ...parsed, unit: $("#fx-unit").value.trim(), decimals: Math.max(0, Math.min(8, Number($("#fx-dec").value) || 0)), notes: $("#fx-notes").value.trim(), placeholder: false, createdBy: S.uid, createdAt: new Date().toISOString() };
  if (await write(() => S.db.doc("formulas/" + id).set(body), `${m.name} formula v${version} saved.`)) go("formulas");
}

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.closest("#main") && el.id) el.dataset.dirty = "1";
  if (el.id === "logq") { ui.q = el.value; const pos = el.selectionStart; render(); const q = $("#logq"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
  const rf = el.closest("form[data-result]");
  if (rf) livePreview(rf);
  if (el.closest("#calForm")) calFormLive();
  if (el.closest("#verifyForm")) verifyLive();
  if (el.closest("#formulaForm")) formulaLive();
});

document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.id === "logshow") { ui.show = el.value; render(); return; }
  if (el.id === "calBlend") { ui.calBlend = el.value; render(); return; }
  if (el.id === "c-blend") { ui.calFormBlend = el.value; $$("#calForm [data-dirty]").forEach((x) => delete x.dataset.dirty); render(); return; }
  if (el.dataset.status) {
    const s = sampleById(route().slice(7));
    const st = el.value;
    await write(() => S.db.doc("samples/" + s.id).update({ tests: { [el.dataset.status]: { status: st, by: st === "completed" ? S.uid : null, at: st === "completed" ? new Date().toISOString() : null } } }), "Status updated.");
    delete el.dataset.dirty;
  }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "sampleForm") return submitSample(f, e.submitter && e.submitter.dataset.another);
  if (f.id === "calForm") return submitCal();
  if (f.id === "verifyForm") return submitVerify(f);
  if (f.id === "formulaForm") return submitFormula(f);
  if (f.dataset.result) return saveResult(sampleById(route().slice(7)), f.dataset.result, f);
});

document.addEventListener("click", async (e) => {
  const row = e.target.closest("tr[data-href]");
  if (row && !e.target.closest("a, button, input, select")) { go(row.dataset.href); return; }
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (d.toggle) { ui.expanded[d.toggle] = b.closest(".test").classList.contains("collapsed"); render(); return; }
  if (d.addtest) { const mid = $("#addTest").value; await write(() => S.db.doc("samples/" + d.addtest).update({ tests: { [mid]: { status: "requested" } } }), `${methodById(mid).name} added.`); return; }
  if (d.newreport) return createReport(sampleById(d.newreport));
  if (d.askdelete) { ui.confirm = "delete-" + d.askdelete; render(); return; }
  if (d.cancelconfirm !== undefined) { ui.confirm = null; render(); return; }
  if (d.delsample) { ui.confirm = null; if (await write(() => S.db.doc("samples/" + d.delsample).delete(), "Sample deleted.")) go("log"); return; }
  if (d.savereport) { await write(() => S.db.doc("reports/" + d.savereport).update({ to: $("#r-to").value.trim(), cc: $("#r-cc").value.trim(), notes: $("#r-notes").value.trim() }), "Report details saved."); $$("#main [data-dirty]").forEach((x) => delete x.dataset.dirty); return; }
  if (d.pdf) { b.disabled = true; await downloadPdf(S.reports.find((r) => r.id === d.pdf)); b.disabled = false; return; }
  if (d.copy) {
    const el = $("#" + d.copy);
    try { await navigator.clipboard.writeText(el.value); toast("Copied."); } catch { el.focus(); el.select(); toast("Press Ctrl+C to copy the selected text."); }
    return;
  }
  if (d.sent) return markSent(S.reports.find((r) => r.id === d.sent));
  if (d.calview) { ui.calArchive = d.calview === "archive"; render(); return; }
  if (d.saveinit !== undefined) { const v = $("#my-init").value.trim().toUpperCase().slice(0, 4); await write(() => S.db.doc("people/" + S.uid).set({ initials: v }), "Initials saved."); return; }
  if (d.savesettings !== undefined) {
    const tol = Number($("#set-tol").value), months = Number($("#set-months").value);
    if (!(tol > 0) || !(months >= 1)) { toast("Enter a tolerance above 0 and at least 1 month."); return; }
    await write(() => S.db.doc("settings/lab").set({ labName: $("#set-name").value.trim(), tolerance: tol, validMonths: Math.round(months), signature: $("#set-sig").value.trim() }), "Settings saved.");
    $$("#main [data-dirty]").forEach((x) => delete x.dataset.dirty);
    return;
  }
  if (d.savemethod) {
    const id = d.savemethod;
    await write(() => S.db.doc("methods/" + id).update({ code: $("#m-code-" + CSS.escape(id)).value.trim(), order: Number($("#m-order-" + CSS.escape(id)).value) || 0, active: $("#m-active-" + CSS.escape(id)).checked }), "Test saved.");
    ["m-code-", "m-order-", "m-active-"].forEach((p) => { const x = document.getElementById(p + id); if (x) delete x.dataset.dirty; });
    return;
  }
  if (d.addmethod !== undefined) {
    const name = $("#nm-name").value.trim();
    if (!name) { toast("Enter the test name."); return; }
    let id = slug(name); if (methodById(id)) id += "-" + uid36().slice(-4);
    const group = $("#nm-group").value;
    const order = Math.max(0, ...S.methods.filter((m) => m.group === group).map((m) => m.order || 0)) + 10;
    if (await write(() => S.db.doc("methods/" + id).set({ name, group, type: $("#nm-type").value, code: $("#nm-code").value.trim(), unit: $("#nm-unit").value.trim(), order, active: true, everySample: false }), `${name} added.`)) {
      ["nm-name", "nm-code", "nm-unit"].forEach((x) => { $("#" + x).value = ""; delete $("#" + x).dataset.dirty; });
    }
    return;
  }
  if (d.addblend !== undefined) {
    const name = $("#nb-name").value.trim();
    if (!name) { toast("Enter the blend name."); return; }
    const components = [];
    for (const line of $("#nb-comps").value.split("\n")) {
      if (!line.trim()) continue;
      const [cn, pct] = line.split("|").map((x) => (x || "").trim());
      if (!cn || pct === "" || !isFinite(Number(pct))) { toast(`Check the line "${line.trim()}": use component | %.`); return; }
      components.push({ name: cn, nominal: Number(pct) });
    }
    if (!components.length) { toast("Add at least one component."); return; }
    if (await write(() => S.db.doc("blends/" + slug(name)).set({ name, components, active: true }), `${name} added.`)) {
      ["nb-name", "nb-comps"].forEach((x) => { $("#" + x).value = ""; delete $("#" + x).dataset.dirty; });
    }
  }
});

window.addEventListener("hashchange", () => { ui.confirm = null; window.scrollTo(0, 0); render(); });

/* ------------------------------------------------------------------ */
/* Boot: connect to the shared database and subscribe once per list.    */
/* ------------------------------------------------------------------ */
async function refreshProfiles() {
  if (!S.user) return;
  const ids = new Set();
  S.samples.forEach((s) => { ids.add(s.receivedBy); Object.values(s.tests || {}).forEach((t) => ids.add(t.by)); });
  S.cals.forEach((c) => { ids.add(c.by); (c.verifications || []).forEach((v) => ids.add(v.by)); });
  S.reports.forEach((r) => { ids.add(r.createdBy); ids.add(r.sentBy); });
  if (S.uid) ids.add(S.uid);
  const list = [...ids].filter(Boolean);
  if (!list.length) return;
  const before = JSON.stringify(Object.keys(S.profiles).map((k) => [k, S.profiles[k].name]));
  const ps = await S.user.profiles(list);
  for (const [k, p] of Object.entries(ps)) S.profiles[k] = { name: p.name };
  if (JSON.stringify(Object.keys(S.profiles).map((k) => [k, S.profiles[k].name])) !== before) scheduleRender();
}

(async function boot() {
  const claude = window.claude;
  const [db, user] = await Promise.all([claude?.use("db") ?? null, claude?.use("user") ?? null]);
  S.db = db; S.user = user;
  if (!db) { render(); return; }
  if (user) {
    const me = await user.me();
    S.uid = me.id;
    $("#who").textContent = me.name || "";
    const can = await user.can("data.write");
    S.canWrite = can === false ? false : can === true ? true : null;
  }
  const keyFor = { calibrations: "cals" };
  for (const name of COLLECTIONS) {
    db.collection(name).onSnapshot((snap) => {
      const docs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (name === "people") S.people = Object.fromEntries(docs.map((d) => [d.id, d]));
      else S[keyFor[name] || name] = docs;
      S.loaded.add(name);
      scheduleRender();
      refreshProfiles();
    }, (err) => { toast(`Lost the live connection to ${name}. Reload the page.`); console.warn(err); });
  }
  db.doc("settings/lab").onSnapshot((snap) => {
    if (snap.exists) S.settings = { ...S.settings, ...snap.data() };
    scheduleRender();
  });
})();
</script>
