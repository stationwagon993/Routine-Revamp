; Copy this file to config.ini and adjust it for your lab.
; config.ini is not committed to git.

[routine]
lab_name = Analytical Laboratory

; Shared database. Put it on the network drive so every user sees the same
; sample log, e.g.  \\server\Lab\RoutineRevamp\routine.sqlite3
; Leave it commented out to use a local database next to manage.py.
; database_path = \\server\Lab\RoutineRevamp\routine.sqlite3

; Folder on the network drive where report PDFs are saved (one subfolder per year).
; reports_dir = \\server\Lab\Reports

; Calibration rules.
calibration_valid_months = 6
; Each blend's verification rule is set in Admin -> Blends. This is only used
; for verifications saved before that (within this many percentage points).
verification_tolerance = 0.03
; Days a standard cylinder can be used after it's prepared.
standard_valid_days = 7
; Days a passing non-condensables verification is good for.
nc_verification_valid_days = 7

; Appended to every report email. Use \n for a new line.
email_signature = Regards,\nAnalytical Laboratory

time_zone = America/Chicago

; Show detailed error pages. Keep false for everyday use.
debug = false
